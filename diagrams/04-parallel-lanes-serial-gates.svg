<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220" font-family="sans-serif">
<style>.box{fill:#f2f4f7;stroke:#334155;stroke-width:1.5} .gate{fill:#fef3c7;stroke:#92400e;stroke-width:1.5} .t{font-size:14px;fill:#111827} .s{font-size:11px;fill:#475569} .a{stroke:#334155;stroke-width:1.5;marker-end:url(#ar)}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect x="20" y="30" width="180" height="60" rx="10" class="box"/><text x="110" y="58" text-anchor="middle" class="t">Track A</text><text x="110" y="78" text-anchor="middle" class="s">files X only</text><rect x="20" y="120" width="180" height="60" rx="10" class="box"/><text x="110" y="148" text-anchor="middle" class="t">Track B</text><text x="110" y="168" text-anchor="middle" class="s">files Y only</text><rect x="280" y="75" width="180" height="60" rx="10" class="gate"/><text x="370" y="103" text-anchor="middle" class="t">Serial gate</text><text x="370" y="123" text-anchor="middle" class="s">vet → merge → push</text><rect x="500" y="75" width="180" height="60" rx="10" class="box"/><text x="590" y="103" text-anchor="middle" class="t">Next claim</text><text x="590" y="123" text-anchor="middle" class="s">one at a time</text><line x1="200" y1="60" x2="280" y2="95" class="a"/><line x1="200" y1="150" x2="280" y2="115" class="a"/><line x1="460" y1="105" x2="500" y2="105" class="a"/><text x="450" y="200" text-anchor="middle" class="s">Figure 4 — Parallel lanes, serial gates. Lanes share no file, branch, browser, or account. Does NOT show the failure case (shared state = race).</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" font-family="sans-serif">
<style>.box{fill:#f2f4f7;stroke:#334155;stroke-width:1.5} .gate{fill:#fef3c7;stroke:#92400e;stroke-width:1.5} .t{font-size:14px;fill:#111827} .s{font-size:11px;fill:#475569} .a{stroke:#334155;stroke-width:1.5;marker-end:url(#ar)}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect x="20" y="50" width="220" height="60" rx="10" class="box"/><text x="130" y="78" text-anchor="middle" class="t">verify (no flag)</text><text x="130" y="98" text-anchor="middle" class="s">CHECKS PASS (vet pending)</text><rect x="20" y="140" width="220" height="60" rx="10" class="gate"/><text x="130" y="168" text-anchor="middle" class="t">STOP — not a merge</text><rect x="300" y="50" width="260" height="60" rx="10" class="box"/><text x="430" y="78" text-anchor="middle" class="t">verify --require-vet</text><text x="430" y="98" text-anchor="middle" class="s">reads vet file line 1</text><rect x="600" y="50" width="180" height="60" rx="10" class="gate"/><text x="690" y="78" text-anchor="middle" class="t">ship / ship-with-nits</text><text x="690" y="98" text-anchor="middle" class="s">VERIFY PASS</text><rect x="600" y="140" width="180" height="60" rx="10" class="gate"/><text x="690" y="168" text-anchor="middle" class="t">rework / missing</text><text x="690" y="188" text-anchor="middle" class="s">VERIFY FAIL</text><line x1="130" y1="110" x2="130" y2="140" class="a"/><line x1="240" y1="80" x2="300" y2="80" class="a"/><line x1="560" y1="80" x2="600" y2="80" class="a"/><line x1="690" y1="110" x2="690" y2="140" class="a"/><text x="450" y="210" text-anchor="middle" class="s">Figure 3 — Vet-gated verify split. A PASS that does not encode the vet verdict is not a gate. Does NOT show the regression test that guards it.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" font-family="sans-serif">
<style>.box{fill:#f2f4f7;stroke:#334155;stroke-width:1.5} .gate{fill:#fef3c7;stroke:#92400e;stroke-width:1.5} .t{font-size:14px;fill:#111827} .s{font-size:11px;fill:#475569} .a{stroke:#334155;stroke-width:1.5;marker-end:url(#ar)}</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect x="20" y="60" width="160" height="60" rx="10" class="box"/><text x="100" y="88" text-anchor="middle" class="t">Builder</text><text x="100" y="108" text-anchor="middle" class="s">proposes</text><rect x="210" y="60" width="160" height="60" rx="10" class="gate"/><text x="290" y="88" text-anchor="middle" class="t">Fresh vet</text><text x="290" y="108" text-anchor="middle" class="s">cold-reads diff</text><rect x="400" y="60" width="180" height="60" rx="10" class="gate"/><text x="490" y="88" text-anchor="middle" class="t">Parent browser</text><text x="490" y="108" text-anchor="middle" class="s">click-through</text><rect x="610" y="60" width="160" height="60" rx="10" class="gate"/><text x="690" y="88" text-anchor="middle" class="t">Parent push check</text><text x="690" y="108" text-anchor="middle" class="s">API verify</text><line x1="180" y1="90" x2="210" y2="90" class="a"/><line x1="370" y1="90" x2="400" y2="90" class="a"/><line x1="580" y1="90" x2="610" y2="90" class="a"/><line x1="290" y1="120" x2="290" y2="170" class="a"/><line x1="290" y1="170" x2="100" y2="170" class="a"/><line x1="100" y1="170" x2="100" y2="120" class="a"/><text x="450" y="200" text-anchor="middle" class="s">Figure 2 — One work item: build → vet → browser → push. Rework arrows return to the builder. Does NOT show heartbeat or retro.</text></svg>